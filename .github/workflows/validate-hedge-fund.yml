name: Validate AI hedge-fund paper strategy

on:
  push:
    branches: [feature/ai-hedge-fund-paper]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pandas
      - run: python -m compileall -q app.py engine.py background_trader.py hedge_fund_strategy.py
      - run: python -m unittest discover -s tests -v
